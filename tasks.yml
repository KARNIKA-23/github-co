
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  description: Clean up the workspace before running the pipeline
  steps:
    - name: remove-files
      image: alpine:3.20
      script: |
        #!/bin/sh
        echo "Cleaning workspace"
        find /workspace/source -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null || true
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  description: Install dependencies and run Python unit tests using nose
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: python:3.11
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        python -m pip install --upgrade pip
        pip install nose
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        nosetests
